media:
  input: media
  output: /daily-wallpaper/media

content:
  - name: theme
    label: Thème de la semaine
    type: file
    path: data/theme.json
    fields:
      - name: theme
        label: Thème
        type: string
      - name: description
        label: Description
        type: text
      - name: debut
        label: Début de la semaine
        type: date

   - name: collections
    label: Collections
    type: file
    path: data/collections.json
    fields:
      - name: categories
        label: Catégories
        type: object
        list: true
        fields:
          - name: emoji
            label: Emoji
            type: string
          - name: nom
            label: Nom de la catégorie
            type: string
          - name: wallpapers
            label: Wallpapers
            type: object
            list: true
            fields:
              - name: titre
                label: Titre
                type: string
              - name: image
                label: Image
                type: image

  - name: culture
    label: Culture
    type: file
    path: data/culture.json
    fields:
      - name: categories
        label: Catégories
        type: object
        list: true
        fields:
          - name: emoji
            label: Emoji
            type: string
          - name: nom
            label: Nom de la catégorie
            type: string
          - name: anecdotes
            label: Anecdotes
            type: object
            list: true
            fields:
              - name: titre
                label: Titre
                type: string
              - name: texte
                label: Texte
                type: text