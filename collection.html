<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection — Daily Wallpaper</title>
<link rel="icon" type="image/png" href="images/kitsu-icon.png?v=2">
<link rel="apple-touch-icon" href="images/kitsu-icon.png?v=2">

<style>
  :root {
    --bg: #0a0e14;
    --bg-header: #0a0e14ee;
    --card-bg: #131822;
    --text-light: #ffffff;
    --text-muted: #9aa4b2;
    --accent: #F97316;
    --accent-action: #22c55e;
    --border: #1f2530;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-light);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 40px;
    background: var(--bg-header);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .logo-icon img { width: 100%; height: 100%; object-fit: cover; }
  .logo-text { line-height: 1.2; }
  .logo-text .name { font-weight: 700; font-size: 17px; }
  .logo-text .sub { font-size: 11px; color: var(--accent); letter-spacing: 0.5px; }

  nav { display: flex; align-items: center; gap: 28px; }
  nav a { color: var(--text-light); text-decoration: none; font-size: 14px; opacity: 0.85; }
  nav a.active, nav a:hover { opacity: 1; color: var(--accent); }

  .nav-dropdown { position: relative; padding-bottom: 14px; margin-bottom: -14px; }
  .nav-dropdown > a { display: flex; align-items: center; gap: 4px; }
  .dropdown-menu {
    position: absolute; top: 100%; left: 0;
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px; min-width: 160px;
    display: none; flex-direction: column; gap: 2px;
  }
  .nav-dropdown:hover .dropdown-menu { display: flex; }
  .dropdown-menu a { color: var(--text-muted); text-decoration: none; font-size: 14px; padding: 8px 12px; border-radius: 6px; white-space: nowrap; }
  .dropdown-menu a:hover { background: #1a2030; color: var(--text-light); }
  .arrow { position: relative; top: 1px; }

  .cta-button {
    background: var(--accent-action);
    color: #06240f;
    padding: 10px 20px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }

  .hero { text-align: center; padding: 60px 20px 30px; }

  .back-link {
    display: inline-block;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 14px;
    margin-bottom: 22px;
  }
  .back-link:hover { color: var(--accent); }

  .eyebrow {
    color: var(--accent);
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
  }
  .eyebrow::before { content: ""; width: 24px; height: 1px; background: var(--accent); display: inline-block; }

  .hero h1 { font-size: 40px; margin: 0 0 14px; }
  .hero p { max-width: 560px; margin: 0 auto; color: var(--text-muted); font-size: 15px; line-height: 1.6; }

  /* --- Grille de wallpapers (format téléphone) --- */
  .wall-grid {
    max-width: 1100px;
    margin: 30px auto 0;
    padding: 0 20px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
  }

  .wall-card {
    position: relative;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    background: var(--card-bg);
    aspect-ratio: 9 / 16;
    cursor: pointer;
    color: inherit;
    font-family: inherit;
  }

  .wall-card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.25s; }
  .wall-card:hover img { transform: scale(1.04); }

  .wall-title {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 28px 14px 14px;
    background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    font-size: 14px;
    font-weight: 600;
    text-align: left;
  }

  .empty { grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px 0; }

  /* --- Agrandissement d'une image --- */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 14, 0.94);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .lightbox.open { display: flex; }

  .lightbox-content { text-align: center; max-width: 100%; }
  .lightbox-content img { max-width: 100%; max-height: 70vh; border-radius: 14px; display: block; margin: 0 auto; }
  .lightbox-content p { font-size: 16px; font-weight: 600; margin: 16px 0 14px; }

  .lb-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  .btn-main, .btn-secondary {
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    padding: 12px 26px;
    cursor: pointer;
    text-decoration: none;
    font-family: inherit;
    display: inline-block;
  }
  .btn-main { background: var(--accent-action); color: #06240f; border: none; }
  .btn-secondary { background: transparent; color: var(--text-light); border: 1px solid var(--border); font-weight: 500; }

  @media (max-width: 900px) {
    header { padding: 14px 20px; }
    .hero h1 { font-size: 30px; }
  }

  @media (max-width: 500px) {
    .wall-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 12px 70px; }
  }
</style>
<link rel="stylesheet" href="menu-mobile.css">
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-icon"><img src="images/logo.png" alt="Logo Daily Wallpaper"></div>
      <div class="logo-text">
        <div class="name">Daily Wallpaper</div>
        <div class="sub">CANAL WHATSAPP</div>
      </div>
    </div>
    <button class="burger" id="burger" aria-label="Ouvrir le menu" aria-expanded="false">☰</button>
    <div class="nav-panel">
      <nav>
        <a href="index.html">Accueil</a>
        <a href="collections.html" class="active">Collections</a>
        <a href="nouvelles.html">Nouvelles</a>
        <div class="nav-dropdown">
          <a href="#">Plus <span class="arrow">⌄</span></a>
          <div class="dropdown-menu">
            <a href="culture.html">Culture</a>
            <a href="quiz.html">Quiz</a>
            <a href="avis.html">Donne ton avis</a>
            <a href="contact.html">Message anonyme</a>
          </div>
        </div>
        <a href="#">Connexion</a>
        <a href="#">Discord</a>
      </nav>
      <a class="cta-button" href="https://whatsapp.com/channel/0029VbCLrYOJ3juwuvAiIg3p">Rejoindre la chaîne</a>
    </div>
  </header>

  <section class="hero">
    <a class="back-link" href="collections.html">← Toutes les collections</a>
    <div class="eyebrow">COLLECTION</div>
    <h1 id="col-title">Chargement…</h1>
    <p id="col-desc"></p>
  </section>

  <div class="wall-grid" id="wall-grid"></div>

  <!-- Fenêtre d'agrandissement -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-content">
      <img id="lb-img" src="" alt="">
      <p id="lb-title"></p>
      <div class="lb-actions">
        <a class="btn-main" id="lb-download" href="#" download>⬇ Télécharger</a>
        <button class="btn-secondary" id="lb-close">Fermer</button>
      </div>
    </div>
  </div>

  <script src="collections-data.js"></script>
  <script src="wallpapers-data.js"></script>
  <script>
    // 1. Quelle collection ? On lit l'adresse : collection.html?c=mythologie
    const params = new URLSearchParams(window.location.search);
    const collectionId = params.get("c");
    const collection = collections.find(c => c.id === collectionId);

    const titleEl = document.getElementById("col-title");
    const descEl = document.getElementById("col-desc");
    const grid = document.getElementById("wall-grid");

    // 2. On affiche le titre et les wallpapers de cette collection
    if (!collection) {
      titleEl.textContent = "Collection introuvable";
      descEl.textContent = "Cette collection n'existe pas (ou plus). Retourne à la liste des collections.";
    } else {
      document.title = collection.titre + " — Daily Wallpaper";
      titleEl.textContent = collection.titre;
      descEl.textContent = collection.description;

      const items = wallpapers.filter(w => w.visible && w.collection === collection.id);

      if (items.length === 0) {
        grid.innerHTML = '<p class="empty">Les wallpapers de cette collection arrivent bientôt 🦊</p>';
      }

      items.forEach(w => {
        const card = document.createElement("button");
        card.className = "wall-card";

        const img = document.createElement("img");
        img.src = w.image;
        img.alt = w.titre;
        img.loading = "lazy";

        const label = document.createElement("span");
        label.className = "wall-title";
        label.textContent = w.titre;

        card.appendChild(img);
        card.appendChild(label);
        card.addEventListener("click", () => openLightbox(w));
        grid.appendChild(card);
      });
    }

    // 3. Fenêtre d'agrandissement
    const lightbox = document.getElementById("lightbox");

    function openLightbox(w) {
      document.getElementById("lb-img").src = w.image;
      document.getElementById("lb-img").alt = w.titre;
      document.getElementById("lb-title").textContent = w.titre;
      const dl = document.getElementById("lb-download");
      dl.href = w.image;
      dl.download = w.image.split("/").pop(); // nom du fichier téléchargé
      lightbox.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      document.body.style.overflow = "";
    }

    document.getElementById("lb-close").addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", e => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });
  </script>
  <script src="menu-mobile.js"></script>

</body>
</html>
