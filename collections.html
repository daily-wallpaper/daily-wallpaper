<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collections — Daily Wallpaper</title>

<style>
  /* ============ VARIABLES DE DESIGN ============
     Change une couleur ici, elle change partout sur la page. */
  :root {
    --bg: #0a0e14;
    --bg-header: #0a0e14ee;
    --card-bg: #131822;
    --text-light: #ffffff;
    --text-muted: #9aa4b2;
    --green: #22c55e;
    --green-dark: #16a34a;
    --border: #1f2530;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-light);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* ============ EN-TÊTE / NAVIGATION ============ */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 40px;
    background: var(--bg-header);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 38px;
    height: 38px;
    background: var(--green);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .logo-text {
    line-height: 1.2;
  }

  .logo-text .name {
    font-weight: 700;
    font-size: 17px;
  }

  .logo-text .sub {
    font-size: 11px;
    color: var(--green);
    letter-spacing: 0.5px;
  }

  nav {
    display: flex;
    align-items: center;
    gap: 28px;
  }

  nav a {
    color: var(--text-light);
    text-decoration: none;
    font-size: 14px;
    opacity: 0.85;
  }

  nav a.active,
  nav a:hover {
    opacity: 1;
    color: var(--green);
  }

  .cta-button {
    background: var(--green);
    color: #06240f;
    padding: 10px 20px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }

  /* ============ HERO (haut de page) ============ */
  .hero {
    text-align: center;
    padding: 70px 20px 40px;
  }

  .eyebrow {
    color: var(--green);
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }

  .eyebrow::before {
    content: "";
    width: 24px;
    height: 1px;
    background: var(--green);
    display: inline-block;
  }

  .hero h1 {
    font-size: 42px;
    margin: 0 0 16px;
  }

  .hero h1 .accent {
    color: var(--green);
  }

  .hero p {
    max-width: 560px;
    margin: 0 auto;
    color: var(--text-muted);
    font-size: 15px;
    line-height: 1.6;
  }

  /* ============ GRILLE DE COLLECTIONS ============ */
  .collections-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    padding: 40px;
    max-width: 1300px;
    margin: 0 auto;
  }

  .collection-card {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    aspect-ratio: 3 / 4;
    background: var(--card-bg);
    text-decoration: none;
  }

  .collection-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .collection-card .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.15) 55%, transparent 100%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 18px;
  }

  .collection-card h3 {
    color: var(--text-light);
    font-size: 17px;
    margin: 0 0 6px;
  }

  .collection-card p {
    color: var(--text-muted);
    font-size: 12.5px;
    line-height: 1.4;
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ============ RESPONSIVE (téléphone / tablette) ============ */
  @media (max-width: 1000px) {
    .collections-grid { grid-template-columns: repeat(2, 1fr); }
    nav { display: none; } /* à remplacer plus tard par un menu mobile */
    header { padding: 14px 20px; }
    .hero h1 { font-size: 30px; }
  }

  @media (max-width: 480px) {
    .collections-grid { grid-template-columns: 1fr; padding: 24px; }
  }
</style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-icon">📱</div>
      <div class="logo-text">
        <div class="name">Daily Wallpaper</div>
        <div class="sub">CANAL WHATSAPP</div>
      </div>
    </div>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="collections.html" class="active">Collections</a>
      <a href="nouvelles.html">Nouvelles</a>
      <a href="#">Plus</a>
      <a href="#">Connexion</a>
      <a href="#">Discord</a>
    </nav>
    <a class="cta-button" href="#">Rejoindre la chaîne</a>
  </header>

  <section class="hero">
    <div class="eyebrow">GALERIE</div>
    <h1>Toutes nos <span class="accent">Collections</span></h1>
    <p>Explorez l'ensemble de nos thèmes en damier. De l'urbain au naturel, trouvez l'ambiance parfaite pour votre écran d'accueil.</p>
  </section>

  <!-- La grille est vide ici : elle est remplie automatiquement -->
  <!-- par le script en bas de page, à partir de collections-data.js -->
  <div class="collections-grid" id="collections-grid"></div>

  <!-- On charge d'abord les DONNÉES, puis le script qui les affiche -->
  <script src="collections-data.js"></script>
  <script>
    // Ce petit script prend chaque collection du fichier de données
    // et fabrique automatiquement une carte à l'écran.
    const grid = document.getElementById("collections-grid");

    collections
      .filter(c => c.visible)
      .forEach(c => {
        const card = document.createElement("a");
        card.className = "collection-card";
        card.href = "#"; // à remplacer plus tard par le lien de la collection

        card.innerHTML = `
          <img src="${c.image}" alt="${c.titre}">
          <div class="overlay">
            <h3>${c.titre}</h3>
            <p>${c.description}</p>
          </div>
        `;

        grid.appendChild(card);
      });
  </script>

</body>
</html>
