<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouvelles — Daily Wallpaper</title>

<style>
  :root {
    --bg: #0a0e14;
    --bg-header: #0a0e14ee;
    --card-bg: #131822;
    --text-light: #ffffff;
    --text-muted: #9aa4b2;
    --accent: #F97316;
    --accent-action: #22c55e;
    --border: #1f2530;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-light);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 40px;
    background: var(--bg-header);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo { display: flex; align-items: center; gap: 10px; }

  .logo-icon {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-icon img { width: 100%; height: 100%; object-fit: cover; }

  .logo-text { line-height: 1.2; }
  .logo-text .name { font-weight: 700; font-size: 17px; }
  .logo-text .sub { font-size: 11px; color: var(--accent); letter-spacing: 0.5px; }

  nav { display: flex; align-items: center; gap: 28px; }
  nav a { color: var(--text-light); text-decoration: none; font-size: 14px; opacity: 0.85; }
  nav a.active, nav a:hover { opacity: 1; color: var(--accent); }

  .cta-button {
    background: var(--accent-action);
    color: #06240f;
    padding: 10px 20px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }

  .hero { text-align: center; padding: 70px 20px 30px; }

  .eyebrow {
    color: var(--accent);
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }
  .eyebrow::before { content: ""; width: 24px; height: 1px; background: var(--accent); display: inline-block; }

  .hero h1 { font-size: 42px; margin: 0 0 16px; }
  .hero h1 .accent { color: var(--accent); }
  .hero p { max-width: 560px; margin: 0 auto; color: var(--text-muted); font-size: 15px; line-height: 1.6; }

  /* --- Filtres --- */
  .filters {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 32px 0 40px;
  }

  .filter-btn {
    background: var(--card-bg);
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 8px 20px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
  }

  .filter-btn.active {
    background: var(--accent-action);
    color: #06240f;
    border-color: var(--accent-action);
    font-weight: 600;
  }

  /* --- Liste d'articles --- */
  .news-list {
    max-width: 750px;
    margin: 0 auto;
    padding: 0 20px 80px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .news-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 28px;
  }

  .news-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .news-badge {
    background: var(--accent-action);
    color: #06240f;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
  }

  .news-date { color: var(--text-muted); font-size: 13px; }

  .news-card h3 { font-size: 19px; margin: 0 0 10px; }
  .news-card p { color: var(--text-muted); font-size: 14px; line-height: 1.6; margin: 0; }

  @media (max-width: 700px) {
    nav { display: none; }
    header { padding: 14px 20px; }
    .hero h1 { font-size: 30px; }
  }.nav-dropdown { position: relative; padding-bottom: 14px; margin-bottom: -14px; }
.nav-dropdown > a { display: flex; align-items: center; gap: 4px; }
.dropdown-menu {
  position: absolute; top: 100%; left: 0;
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px; min-width: 160px;
  display: none; flex-direction: column; gap: 2px;
}
.nav-dropdown:hover .dropdown-menu { display: flex; }
.dropdown-menu a { color: var(--text-muted); text-decoration: none; font-size: 14px; padding: 8px 12px; border-radius: 6px; }
.dropdown-menu a:hover { background: #1a2030; color: var(--text-light); }
.arrow { position: relative; top: 1px; }
</style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-icon"><img src="images/logo.png" alt="Logo Daily Wallpaper"></div>
      <div class="logo-text">
        <div class="name">Daily Wallpaper</div>
        <div class="sub">CANAL WHATSAPP</div>
      </div>
    </div>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="collections.html">Collections</a>
      <a href="nouvelles.html" class="active">Nouvelles</a>
      <div class="nav-dropdown">
  <a href="#">Plus <span class="arrow">⌄</span></a>
  <div class="dropdown-menu">
  <a href="#">Culture</a>
  <a href="#">Quiz</a>
  <a href="contact.html">Message anonyme</a>
</div>
</div>
      <a href="#">Connexion</a>
      <a href="#">Discord</a>
    </nav>
    <a class="cta-button" href="https://whatsapp.com/channel/0029VbCLrYOJ3juwuvAiIg3p">Rejoindre la chaîne</a>
  </header>

  <section class="hero">
    <div class="eyebrow">ACTUALITÉS</div>
    <h1>Dernières <span class="accent">Nouvelles</span></h1>
    <p>Suivez les dernières mises à jour, nouvelles collections et améliorations de notre système.</p>
  </section>

  <div class="filters">
    <button class="filter-btn active" data-filter="toutes">Toutes</button>
    <button class="filter-btn" data-filter="nouveaute">Nouveauté</button>
  </div>

  <!-- La liste est vide ici : elle est remplie automatiquement -->
  <!-- par le script en bas de page, à partir de nouvelles-data.js -->
  <div class="news-list" id="news-list"></div>

  <script src="nouvelles-data.js"></script>
  <script>
    const list = document.getElementById("news-list");
    const buttons = document.querySelectorAll(".filter-btn");
    let currentFilter = "toutes";

    function render() {
      list.innerHTML = "";
      nouvelles
        .filter(n => currentFilter === "toutes" || n.categorie === currentFilter)
        .forEach(n => {
          const card = document.createElement("div");
          card.className = "news-card";
          card.innerHTML = `
            <div class="news-meta">
              <span class="news-badge">${n.badge}</span>
              <span class="news-date">${n.date}</span>
            </div>
            <h3>${n.titre}</h3>
            <p>${n.texte}</p>
          `;
          list.appendChild(card);
        });
    }

    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    render();
  </script>

</body>
</html>
