<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Daily Wallpaper</title>
<link rel="icon" type="image/png" href="images/kitsu-icon.png">
<link rel="apple-touch-icon" href="images/kitsu-icon.png">
<style>
  :root {
    --bg: #0a0e14;
    --bg-header: #0a0e14ee;
    --card-bg: #131822;
    --text-light: #ffffff;
    --text-muted: #9aa4b2;
    --accent: #F97316;
    --accent-action: #22c55e;
    --wrong: #f87171;
    --border: #1f2530;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-light);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 40px;
    background: var(--bg-header);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .logo-icon img { width: 100%; height: 100%; object-fit: cover; }
  .logo-text { line-height: 1.2; }
  .logo-text .name { font-weight: 700; font-size: 17px; }
  .logo-text .sub { font-size: 11px; color: var(--accent); letter-spacing: 0.5px; }

  nav { display: flex; align-items: center; gap: 28px; }
  nav a { color: var(--text-light); text-decoration: none; font-size: 14px; opacity: 0.85; }
  nav a.active, nav a:hover { opacity: 1; color: var(--accent); }

  .nav-dropdown { position: relative; padding-bottom: 14px; margin-bottom: -14px; }
  .nav-dropdown > a { display: flex; align-items: center; gap: 4px; }
  .dropdown-menu {
    position: absolute; top: 100%; left: 0;
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px; min-width: 160px;
    display: none; flex-direction: column; gap: 2px;
  }
  .nav-dropdown:hover .dropdown-menu { display: flex; }
  .dropdown-menu a { color: var(--text-muted); text-decoration: none; font-size: 14px; padding: 8px 12px; border-radius: 6px; white-space: nowrap; }
  .dropdown-menu a:hover { background: #1a2030; color: var(--text-light); }
  .arrow { position: relative; top: 1px; }

  .cta-button {
    background: var(--accent-action);
    color: #06240f;
    padding: 10px 20px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }

  .hero { text-align: center; padding: 70px 20px 30px; }

  .eyebrow {
    color: var(--accent);
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }
  .eyebrow::before { content: ""; width: 24px; height: 1px; background: var(--accent); display: inline-block; }

  .hero h1 { font-size: 42px; margin: 0 0 16px; }
  .hero h1 .accent { color: var(--accent); }
  .hero p { max-width: 560px; margin: 0 auto; color: var(--text-muted); font-size: 15px; line-height: 1.6; }

  /* --- Carte du quiz --- */
  .quiz-box {
    max-width: 720px;
    margin: 30px auto 90px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 32px;
  }

  .quiz-top {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .quiz-progress {
    height: 6px;
    background: var(--bg);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 28px;
  }

  .quiz-progress-bar {
    height: 100%;
    width: 0;
    background: var(--accent-action);
    border-radius: 999px;
    transition: width 0.3s;
  }

  .quiz-question { font-size: 22px; line-height: 1.4; margin: 0 0 24px; }

  .quiz-answers { display: flex; flex-direction: column; gap: 12px; }

  .answer-btn {
    width: 100%;
    text-align: left;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-light);
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }

  .answer-btn:hover:not(:disabled) { border-color: var(--accent); }
  .answer-btn:disabled { cursor: default; }

  .answer-btn.correct {
    background: rgba(34, 197, 94, 0.15);
    border-color: var(--accent-action);
  }

  .answer-btn.wrong {
    background: rgba(248, 113, 113, 0.15);
    border-color: var(--wrong);
  }

  .quiz-explication {
    display: none;
    margin-top: 20px;
    padding: 14px 18px;
    background: var(--bg);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.6;
  }

  .quiz-explication.show { display: block; }

  .quiz-footer { display: flex; justify-content: flex-end; margin-top: 24px; }

  .btn-main, .btn-secondary {
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    padding: 12px 26px;
    cursor: pointer;
    text-decoration: none;
    font-family: inherit;
    display: inline-block;
  }

  .btn-main { background: var(--accent-action); color: #06240f; border: none; }
  .btn-secondary { background: transparent; color: var(--text-light); border: 1px solid var(--border); font-weight: 500; }

  /* --- Écran de résultat --- */
  .quiz-result { text-align: center; padding: 10px 0; }
  .result-score { font-size: 64px; font-weight: 800; color: var(--accent); margin: 10px 0 6px; }
  .result-message { font-size: 20px; margin: 0 0 8px; }
  .result-sub { color: var(--text-muted); font-size: 14px; margin: 0 0 30px; }
  .result-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  @media (max-width: 900px) {
    nav { display: none; }
    header { padding: 14px 20px; }
    .hero h1 { font-size: 30px; }
  }

  @media (max-width: 600px) {
    .quiz-box { margin: 20px 14px 70px; padding: 22px; }
    .quiz-question { font-size: 19px; }
  }
</style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-icon"><img src="images/logo.png" alt="Logo Daily Wallpaper"></div>
      <div class="logo-text">
        <div class="name">Daily Wallpaper</div>
        <div class="sub">CANAL WHATSAPP</div>
      </div>
    </div>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="collections.html">Collections</a>
      <a href="nouvelles.html">Nouvelles</a>
      <div class="nav-dropdown">
        <a href="#" class="active">Plus <span class="arrow">⌄</span></a>
        <div class="dropdown-menu">
          <a href="culture.html">Culture</a>
          <a href="quiz.html">Quiz</a>
          <a href="avis.html">Donne ton avis</a>
          <a href="contact.html">Message anonyme</a>
        </div>
      </div>
      <a href="#">Connexion</a>
      <a href="#">Discord</a>
    </nav>
    <a class="cta-button" href="https://whatsapp.com/channel/0029VbCLrYOJ3juwuvAiIg3p">Rejoindre la chaîne</a>
  </header>

  <section class="hero">
    <div class="eyebrow">QUIZ</div>
    <h1>Teste ta <span class="accent">culture</span></h1>
    <p>Quelques questions autour des univers de nos wallpapers. Réponds, découvre l'explication et vois ton score !</p>
  </section>

  <!-- Tout le contenu du quiz est créé par le script ci-dessous -->
  <div class="quiz-box" id="quiz-box"></div>

  <script src="quiz-data.js"></script>
  <script>
    const box = document.getElementById("quiz-box");

    // Seulement les questions visibles
    const questions = quizQuestions.filter(q => q.visible);
    const total = questions.length;

    let index = 0;       // numéro de la question en cours (0 = la première)
    let score = 0;       // nombre de bonnes réponses
    let answered = false;

    // Mélange une liste (sans modifier l'original)
    function melanger(liste) {
      return [...liste].sort(() => Math.random() - 0.5);
    }

    function showQuestion() {
      answered = false;
      const q = questions[index];

      box.innerHTML = `
        <div class="quiz-top">
          <span>Question ${index + 1} / ${total}</span>
          <span id="score-label">Score : ${score}</span>
        </div>
        <div class="quiz-progress"><div class="quiz-progress-bar" id="progress-bar"></div></div>
        <h2 class="quiz-question"></h2>
        <div class="quiz-answers" id="answers"></div>
        <div class="quiz-explication" id="explication"></div>
        <div class="quiz-footer"><button class="btn-main" id="next-btn" style="display:none"></button></div>
      `;

      box.querySelector(".quiz-question").textContent = q.question;
      document.getElementById("progress-bar").style.width = (index / total * 100) + "%";

      // Un bouton par réponse, dans un ordre mélangé
      const answersBox = document.getElementById("answers");
      melanger(q.reponses).forEach(reponse => {
        const btn = document.createElement("button");
        btn.className = "answer-btn";
        btn.textContent = reponse;
        btn.addEventListener("click", () => chooseAnswer(btn, reponse, q));
        answersBox.appendChild(btn);
      });
    }

    function chooseAnswer(btn, reponse, q) {
      if (answered) return;
      answered = true;

      const bonne = q.reponses[0]; // la 1re réponse du fichier est la bonne

      document.querySelectorAll(".answer-btn").forEach(b => {
        b.disabled = true;
        if (b.textContent === bonne) b.classList.add("correct");
      });

      if (reponse === bonne) {
        score++;
      } else {
        btn.classList.add("wrong");
      }

      document.getElementById("score-label").textContent = "Score : " + score;
      document.getElementById("progress-bar").style.width = ((index + 1) / total * 100) + "%";

      if (q.explication) {
        const exp = document.getElementById("explication");
        exp.textContent = q.explication;
        exp.classList.add("show");
      }

      const next = document.getElementById("next-btn");
      next.textContent = (index + 1 < total) ? "Question suivante →" : "Voir mon score";
      next.style.display = "inline-block";
      next.addEventListener("click", () => {
        index++;
        if (index < total) { showQuestion(); } else { showResult(); }
      });
    }

    function showResult() {
      const ratio = score / total;
      let message = "Pas mal, retente ta chance ! 💪";
      if (ratio === 1) message = "Parfait, tu es incollable ! 🏆";
      else if (ratio >= 0.6) message = "Bien joué, belle culture ! 🎉";

      box.innerHTML = `
        <div class="quiz-result">
          <p class="result-sub">Ton score</p>
          <div class="result-score">${score} / ${total}</div>
          <p class="result-message">${message}</p>
          <p class="result-sub">Retrouve de nouveaux quiz et un wallpaper chaque jour sur la chaîne.</p>
          <div class="result-actions">
            <button class="btn-main" id="replay-btn">Rejouer</button>
            <a class="btn-secondary" href="culture.html">Voir les fiches Culture</a>
          </div>
        </div>
      `;

      document.getElementById("replay-btn").addEventListener("click", () => {
        index = 0;
        score = 0;
        showQuestion();
      });
    }

    showQuestion();
  </script>

</body>
</html>
